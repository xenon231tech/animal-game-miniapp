<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Card Game - Farcaster Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .header {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            padding: 20px;
            border-radius: 0 0 30px 30px;
        }
        .stats { display: flex; justify-content: space-between; margin-top: 10px; }
        .stat-card { background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 20px; }
        .spin-btn {
            width: 140px; height: 140px; border-radius: 70px;
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            border: none; color: white; font-weight: bold; font-size: 18px;
            margin: 30px auto; display: block; cursor: pointer;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px,1fr)); gap: 12px; padding: 0 15px; }
        .card { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; text-align: center; }
        .card-emoji { font-size: 40px; }
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9); display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item { text-align: center; cursor: pointer; padding: 5px; }
        .page { display: none; }
        .page.active { display: block; }
        .shop-item { background: rgba(255,255,255,0.1); margin: 10px 15px; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: #2ecc71; border: none; padding: 8px 16px; border-radius: 20px; color: white; cursor: pointer; }
        .popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: #1e1e2e; border: 2px solid #f9ca24; border-radius: 24px;
            padding: 24px; text-align: center; z-index: 100; display: none;
        }
        .popup.show { display: block; animation: pop 0.3s ease; }
        @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.8); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>

<div class="loading" id="loading">Loading Farcaster Mini App...</div>

<div id="app" style="display: none;">
    <div class="header">
        <div style="display: flex; justify-content: space-between;">
            <h1>🎮 ANIMALCARD</h1>
            <div class="stat-card">⭐ <span id="points">0</span></div>
        </div>
        <div class="stats">
            <div class="stat-card">🎲 Spins: <span id="spins">0</span></div>
            <div class="stat-card">⚡ x<span id="multiplier">1</span></div>
        </div>
    </div>

    <button class="spin-btn" id="spinBtn">🎰<br>SPIN</button>

    <div id="gamePage" class="page active">
        <div class="grid" id="recentCards"></div>
    </div>

    <div id="shopPage" class="page">
        <div id="shopItems"></div>
    </div>

    <div id="collectionPage" class="page">
        <div id="collectionGrid" class="grid"></div>
    </div>

    <div id="statsPage" class="page">
        <div style="padding: 20px;">
            <div id="statsContent"></div>
        </div>
    </div>

    <div id="mePage" class="page">
        <div style="padding: 20px;">
            <div id="meContent"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item" data-page="game">🎮 GAME</div>
        <div class="nav-item" data-page="shop">🛒 SHOP</div>
        <div class="nav-item" data-page="collection">📦 COLLECTION</div>
        <div class="nav-item" data-page="stats">📊 STATS</div>
        <div class="nav-item" data-page="me">👤 ME</div>
    </div>
</div>

<div id="popup" class="popup">
    <div id="popupMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@neynar/react@1.9.0/dist/index.umd.js"></script>
<script>
    // ============ WALLET TUJUAN ============
    const YOUR_WALLET = '0x0E2946D068Bc33a19eBa63ad816A5168d22b039D';
    
    // ============ DATA GAME ============
    const cards = [
        { id: 'ant', name: 'Ant', emoji: '🐜', rarity: 'common', points: 100, max: 5 },
        { id: 'mouse', name: 'Mouse', emoji: '🐭', rarity: 'common', points: 150, max: 1 },
        { id: 'cat', name: 'Cat', emoji: '🐱', rarity: 'rare', points: 1000, max: 1 },
        { id: 'dog', name: 'Dog', emoji: '🐶', rarity: 'rare', points: 1200, max: 1 },
        { id: 'wolf', name: 'Wolf', emoji: '🐺', rarity: 'epic', points: 2200, max: 1 },
        { id: 'eagle', name: 'Eagle', emoji: '🦅', rarity: 'legendary', points: 2500, max: 1 },
        { id: 'dragon', name: 'Dragon', emoji: '🐉', rarity: 'legendary', points: 5000, max: 1 }
    ];
    
    let gameState = {
        points: 1240,
        spins: 8,
        multiplier: 2,
        collected: JSON.parse(JSON.stringify(cards.map(c => ({ ...c, owned: c.id === 'ant' ? 5 : 0 }))))
    };
    
    function saveGame() { localStorage.setItem('animal_game', JSON.stringify(gameState)); }
    function loadGame() {
        const saved = localStorage.getItem('animal_game');
        if (saved) gameState = JSON.parse(saved);
        updateUI();
    }
    
    function showPopup(msg) {
        const popup = document.getElementById('popup');
        document.getElementById('popupMsg').innerHTML = msg;
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 2500);
    }
    
    function spin() {
        if (gameState.spins <= 0) { showPopup('No spins left! Buy in SHOP ⛔'); return; }
        gameState.spins--;
        
        const r = Math.random();
        let candidates;
        if (r < 0.05) candidates = cards.filter(c => c.rarity === 'legendary' && gameState.collected.find(gc => gc.id === c.id).owned < c.max);
        else if (r < 0.15) candidates = cards.filter(c => c.rarity === 'epic' && gameState.collected.find(gc => gc.id === c.id).owned < c.max);
        else if (r < 0.35) candidates = cards.filter(c => c.rarity === 'rare' && gameState.collected.find(gc => gc.id === c.id).owned < c.max);
        else candidates = cards.filter(c => c.rarity === 'common' && gameState.collected.find(gc => gc.id === c.id).owned < c.max);
        
        if (candidates.length === 0) candidates = cards.filter(c => gameState.collected.find(gc => gc.id === c.id).owned < c.max);
        if (candidates.length === 0) candidates = cards;
        
        const earned = candidates[Math.floor(Math.random() * candidates.length)];
        const cardData = gameState.collected.find(c => c.id === earned.id);
        if (cardData && cardData.owned < cardData.max) cardData.owned++;
        
        const pointsEarned = earned.points * gameState.multiplier;
        gameState.points += pointsEarned;
        
        saveGame();
        updateUI();
        showPopup(`🎉 ${earned.emoji} ${earned.name}! +${pointsEarned} pts`);
    }
    
    function buyItem(item) {
        if (window.confirm(`Buy ${item.name} for ${item.price} USDC?\n\nPayment goes to:\n${YOUR_WALLET}`)) {
            if (item.spins) gameState.spins += item.spins;
            if (item.cardId) {
                const card = gameState.collected.find(c => c.id === item.cardId);
                if (card && card.owned < card.max) card.owned++;
            }
            saveGame();
            updateUI();
            showPopup(`✅ Purchased ${item.name}!`);
        }
    }
    
    function updateUI() {
        document.getElementById('points').innerText = gameState.points;
        document.getElementById('spins').innerText = gameState.spins;
        document.getElementById('multiplier').innerText = gameState.multiplier;
        
        // Recent cards
        const recentDiv = document.getElementById('recentCards');
        recentDiv.innerHTML = cards.map(c => `<div class="card"><div class="card-emoji">${c.emoji}</div><div>${c.name}</div></div>`).join('');
        
        // Shop
        const shopItems = [
            { name: '10 Spins', price: 1, spins: 10, emoji: '🎲' },
            { name: '55 Spins', price: 5, spins: 55, emoji: '🎲🎲' },
            { name: '120 Spins', price: 10, spins: 120, emoji: '🎲🎲🎲' },
            { name: 'Gacha Box', price: 2, spins: 5, emoji: '🎁' },
            { name: '🐉 Dragon Card', price: 50, cardId: 'dragon', emoji: '🐉' }
        ];
        document.getElementById('shopItems').innerHTML = shopItems.map(item => `
            <div class="shop-item">
                <div><span style="font-size:30px">${item.emoji}</span> ${item.name}</div>
                <button class="buy-btn" onclick='buyItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>BUY ${item.price} USDC</button>
            </div>
        `).join('');
        
        // Collection
        document.getElementById('collectionGrid').innerHTML = gameState.collected.map(c => `
            <div class="card">
                <div class="card-emoji">${c.owned > 0 ? c.emoji : '🔒'}</div>
                <div>${c.name}</div>
                <div style="font-size:10px">${c.owned}/${c.max}</div>
                <div style="font-size:10px">${c.points} pts</div>
            </div>
        `).join('');
        
        // Stats
        const unique = gameState.collected.filter(c => c.owned > 0).length;
        const completion = Math.round((unique / cards.length) * 100);
        document.getElementById('statsContent').innerHTML = `
            <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:20px;margin-bottom:15px">
                <div>📊 Collection: ${completion}% (${unique}/${cards.length})</div>
                <div style="background:#333;border-radius:10px;height:10px;margin:10px 0"><div style="background:#f9ca24;border-radius:10px;height:10px;width:${completion}%"></div></div>
            </div>
            <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:20px">
                <div>⭐ Total points: ${gameState.points}</div>
                <div>🎲 Total spins used: ${gameState.spins}</div>
                <div>⚡ Current multiplier: x${gameState.multiplier}</div>
            </div>
        `;
        
        // Me
        document.getElementById('meContent').innerHTML = `
            <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:20px;text-align:center">
                <div style="font-size:50px">👤</div>
                <div style="font-weight:bold">xenon_d62</div>
                <div>FID: 123456</div>
                <div style="margin-top:10px">⭐ VIP Member</div>
                <hr style="margin:15px 0;border-color:#333">
                <div>🔑 Referral: <b>XENON-D62</b></div>
                <button class="buy-btn" style="margin-top:10px" onclick="navigator.clipboard.writeText('XENON-D62')">Share</button>
            </div>
        `;
    }
    
    // Navigation
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(btn.dataset.page + 'Page').classList.add('active');
        });
    });
    
    document.getElementById('spinBtn').onclick = spin;
    
    // Initialize Farcaster Mini App
    window.onload = () => {
        if (window.FarcasterFrameSDK) {
            window.FarcasterFrameSDK.actions.ready();
            console.log('Farcaster Mini App ready');
        }
        loadGame();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    };
</script>
</body>
</html>
